services:
  web:
    environment:
      - NEXT_PUBLIC_BASE_PATH=/calculator
      - NEXT_PUBLIC_API_URL=/calculator/api
      - NEXT_PUBLIC_YANDEX_METRIKA_ID=${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}

  api:
    volumes:
      - ${GOOGLE_CREDENTIALS_FILE:-./apps/api/credentials.json}:/app/credentials.json:ro
